apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-frontend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector: { matchLabels: { app: sre-frontend } }
  template:
    metadata: { labels: { app: sre-frontend } }
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.frontend.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ containerPort: 80 }]
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sre-frontend-service
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector: { app: sre-frontend }
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: {{ .Values.frontend.nodePort }}
