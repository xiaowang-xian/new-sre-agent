apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-app
  namespace: default
spec:
  replicas: 1
  selector: { matchLabels: { app: oom-app } }
  template:
    metadata: { labels: { app: oom-app } }
    spec:
      containers:
        - name: app
          image: python:3.11-slim
          command: ["python", "-c", "a=[]\nwhile True:\n a.append('x'*1024*1024)"]
          resources:
            requests: { memory: "32Mi", cpu: "50m" }
            limits: { memory: "64Mi", cpu: "200m" }
