apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-config-previous
  namespace: default
data:
  APP_MODE: "normal"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-config
  namespace: default
data:
  APP_MODE: "broken"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-error-app
  namespace: default
spec:
  replicas: 1
  selector: { matchLabels: { app: config-error-app } }
  template:
    metadata: { labels: { app: config-error-app } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "test \"$APP_MODE\" = normal || exit 1; sleep 3600"]
          envFrom:
            - configMapRef: { name: demo-app-config }
