apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sre-assistant-rules
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  groups:
    - name: sre-assistant.rules
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[5m]) > 2
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: "Pod 频繁重启"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 最近 5 分钟重启超过 2 次"
        - alert: OOMKilled
          expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: "Pod OOMKilled"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 发生 OOMKilled"
        - alert: ImagePullBackOff
          expr: kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"} == 1
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: "镜像拉取失败"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 镜像拉取失败"
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "节点 NotReady"
            description: "节点 {{ $labels.node }} NotReady"
