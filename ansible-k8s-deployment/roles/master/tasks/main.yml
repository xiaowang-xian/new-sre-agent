---
- name: 初始化 K8s 控制平面
  ansible.builtin.shell: kubeadm init --apiserver-advertise-address={{ master_ip }} --pod-network-cidr={{ pod_network_cidr }} --upload-certs
  args:
    creates: /etc/kubernetes/admin.conf

- name: 创建 kubeconfig 目录
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: 复制 kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: '0640'

- name: 安装 Calico 网络插件
  ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.3/manifests/calico.yaml
  changed_when: false

- name: 生成 join 命令
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_raw
  changed_when: false

- name: 保存 join 命令到 master fact
  ansible.builtin.set_fact:
    join_command: "{{ join_command_raw.stdout }}"
