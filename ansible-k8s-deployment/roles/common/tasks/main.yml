---
- name: 关闭 SELinux
  ansible.posix.selinux:
    state: disabled
  when: ansible_facts['os_family'] == 'RedHat'

- name: 关闭 Swap
  block:
    - ansible.builtin.command: swapoff -a
      changed_when: false
    - ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(.*\sswap\s.*)$'
        replace: '# \1'
  when: ansible_swaptotal_mb | int > 0

- name: 加载内核模块
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: modprobe overlay
  community.general.modprobe:
    name: overlay
    state: present

- name: modprobe br_netfilter
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: 配置 sysctl
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: 应用 sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: 安装基础包 Ubuntu
  ansible.builtin.apt:
    name: [apt-transport-https, ca-certificates, curl, gnupg, lsb-release]
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: 安装基础包 RedHat
  ansible.builtin.dnf:
    name: [dnf-utils, device-mapper-persistent-data, lvm2, curl]
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: 安装 containerd Ubuntu
  ansible.builtin.apt:
    name: containerd
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: 安装 Docker repo RedHat
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
  when: ansible_facts['os_family'] == 'RedHat'

- name: 安装 containerd RedHat
  ansible.builtin.dnf:
    name: containerd.io
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: 配置 containerd systemd cgroup
  ansible.builtin.shell: |
    mkdir -p /etc/containerd
    containerd config default > /etc/containerd/config.toml
    sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: 启动 containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true

- name: 添加 K8s 源 Ubuntu
  ansible.builtin.shell: |
    mkdir -p /etc/apt/keyrings
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
  args:
    creates: /etc/apt/sources.list.d/kubernetes.list
  when: ansible_facts['os_family'] == 'Debian'

- name: 添加 K8s 源 RedHat
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/rpm/
    gpgkey: https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/rpm/repodata/repomd.xml.key
    gpgcheck: true
    enabled: true
    exclude: kubelet kubeadm kubectl kubernetes-cni
  when: ansible_facts['os_family'] == 'RedHat'

- name: 安装 kubelet/kubeadm/kubectl Ubuntu
  ansible.builtin.apt:
    name: [kubelet, kubeadm, kubectl]
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: 安装 kubelet/kubeadm/kubectl RedHat
  ansible.builtin.dnf:
    name: [kubelet, kubeadm, kubectl]
    state: present
    disable_excludes: kubernetes
  when: ansible_facts['os_family'] == 'RedHat'

- name: 启用 kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
