apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector: { matchLabels: { app: sre-backend } }
  template:
    metadata: { labels: { app: sre-backend } }
    spec:
      serviceAccountName: sre-agent
      containers:
        - name: backend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.backend.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: sre-config }
            - secretRef: { name: sre-secret }
          env:
            - name: DB_ENGINE
              value: mysql
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sre-backend-service
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: sre-backend }
  ports: [{ name: http, port: 8001, targetPort: 8001 }]
