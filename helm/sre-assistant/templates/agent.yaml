apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.agent.replicas }}
  selector: { matchLabels: { app: sre-agent } }
  template:
    metadata: { labels: { app: sre-agent } }
    spec:
      serviceAccountName: sre-agent
      containers:
        - name: agent
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.agent.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: sre-config }
            - secretRef: { name: sre-secret }
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 15, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata:
  name: sre-agent-service
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: sre-agent }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
