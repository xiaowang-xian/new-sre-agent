global:
  imageRegistry: "docker.io/yourname"
  imagePullPolicy: IfNotPresent

agent:
  image: sre-agent:latest
  replicas: 1
  dingTalkWebhook: ""
  dryRun: "false"
  ollamaModel: "qwen2:7b-instruct"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

rag:
  image: sre-rag-service:latest
  replicas: 1
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "3Gi" }

backend:
  image: sre-backend:latest
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

frontend:
  image: sre-frontend:latest
  replicas: 1
  nodePort: 30080
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "200m", memory: "128Mi" }

external:
  rabbitmqUrl: "amqp://user:password@rabbitmq.middleware.svc.cluster.local:5672/"
  redisAddr: "redis-master.middleware.svc.cluster.local:6379"
  redisPassword: ""
  mysqlDsn: "sre:srepass@tcp(mysql.middleware.svc.cluster.local:3306)/sre_assistant?charset=utf8mb4&parseTime=True&loc=Local"
  mysqlHost: "mysql.middleware.svc.cluster.local"
  mysqlUser: "sre"
  mysqlPassword: "srepass"
  mysqlDatabase: "sre_assistant"
  elasticsearchUrl: "http://elasticsearch.middleware.svc.cluster.local:9200"
  prometheusUrl: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090"
  ollamaUrl: "http://ollama-service.ai-services.svc.cluster.local:11434/api/generate"
